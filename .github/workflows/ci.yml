name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Public production origin (see README) - only used to satisfy the
          # build-time check in lib/site-url.ts, not a secret.
          NEXT_PUBLIC_SITE_URL: https://smartrain.etienneschwab.ch
